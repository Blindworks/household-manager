# Household Manager - Main Configuration

# Application Name
spring.application.name=household-manager

# DataSource Configuration for MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/household_manager?createDatabaseIfNotExist=true
spring.datasource.username=household_manager
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator Configuration for Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/management
management.endpoint.health.show-details=when-authorized

# Logging Configuration
logging.level.com.household=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# CORS (comma-separated)
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200

# Tasmota Electricity Polling
tasmota.electricity.url=http://192.168.1.134/cm?cmnd=Status%2010
tasmota.electricity.live.interval-ms=1000

# Airrohr Fine Dust Sensor
airrohr.url=http://192.168.1.110/data.json
airrohr.polling.interval-ms=300000
airrohr.polling.initial-delay-ms=15000

# Tapo Configuration
tapo.email=${TAPO_EMAIL:}
tapo.password=${TAPO_PASSWORD:}
tapo.cloud-api-url=https://wap.tplinkcloud.com
tapo.cloud-token-expiry-ms=86400000

# Statische Tapo-IPs nur fuer Umgebungen ohne UDP-Broadcast (z.B. Docker-Bridge) pflegen.
# Veraltete Eintraege verlangsamen jede Discovery um mehrere Verbindungs-Timeouts.
# tapo.devices[0].name=...
# tapo.devices[0].ip=...
# tapo.devices[0].device-id=...


# Meross Cloud Configuration
meross.email=${MEROSS_EMAIL:}
meross.password=${MEROSS_PASSWORD:}
meross.country-code=de
meross.region=eu

# Meross Electricity Polling (spiegelt Verbrauch als sensor.meross_<uuid>_power)
# Gepollt werden automatisch alle messfaehigen Steckdosen des Kontos.
meross.electricity.polling.enabled=true
meross.electricity.polling.interval-ms=60000

# Shelly Balcony Power Plants
shelly.devices[0].name=Balkonkraftwerk-Alt
shelly.devices[0].ip=${SHELLY_1_IP:192.168.1.130}
shelly.devices[1].name=Balkonkraftwerk-Neu
shelly.devices[1].ip=${SHELLY_2_IP:192.168.1.131}
shelly.polling.interval-ms=5000
shelly.http.timeout-ms=3000

# AnkerSolix Solar System
ankersolix.enabled=${ANKER_ENABLED:false}
ankersolix.user=${ANKER_USER:}
ankersolix.password=${ANKER_PASSWORD:}
ankersolix.country=${ANKER_COUNTRY:DE}
ankersolix.live.interval-ms=10000

# DWD Wetter (WarnWetter-App-API)
dwd.base-url=https://app-prod-ws.warnwetter.de/v30/stationOverviewExtended
dwd.station-id=10637
dwd.cache-ttl-ms=600000
dwd.polling.interval-ms=900000
dwd.polling.initial-delay-ms=20000

# UBA Luftqualitaetsindex (Umweltbundesamt)
uba.base-url=https://luftdaten.umweltbundesamt.de/api/air-data/v3/airquality/json
uba.station-id=636
uba.cache-ttl-ms=600000

# Zigbee MQTT (zigbee2mqtt via Mosquitto)
zigbee.mqtt.enabled=${ZIGBEE_MQTT_ENABLED:true}
zigbee.mqtt.host=${ZIGBEE_MQTT_HOST:192.168.1.150}
zigbee.mqtt.port=${ZIGBEE_MQTT_PORT:1883}
zigbee.mqtt.username=${ZIGBEE_MQTT_USER:addons}
zigbee.mqtt.password=${ZIGBEE_MQTT_PASSWORD:}
zigbee.mqtt.topic-filter=zigbee2mqtt/#
# Muss pro laufender Instanz eindeutig sein: der Broker trennt bei gleicher Client-ID
# die bestehende Verbindung (MQTT-Spec) — eine lokale Dev-Instanz mit der PROD-ID
# kickt PROD in eine Reconnect-Schleife und loest den Zigbee-Watchdog aus.
# Lokal deshalb ZIGBEE_MQTT_CLIENT_ID=household-manager-zigbee-dev setzen (oder
# ZIGBEE_MQTT_ENABLED=false).
zigbee.mqtt.client-id=${ZIGBEE_MQTT_CLIENT_ID:household-manager-zigbee}
zigbee.watchdog.enabled=${ZIGBEE_WATCHDOG_ENABLED:true}
zigbee.watchdog.stale-after-minutes=${ZIGBEE_WATCHDOG_STALE_AFTER_MINUTES:15}
zigbee.watchdog.recover-grace-minutes=${ZIGBEE_WATCHDOG_RECOVER_GRACE_MINUTES:5}

# Alexa Text-to-Speech Integration
alexa.domain=${ALEXA_DOMAIN:amazon.de}
# Faelligkeitspruefung fuer geplante Ansagen (ms)
alexa.scheduled.check-interval-ms=60000
# alexa-remote2-Sidecar (Login, Geraeteliste und TTS laufen ueber diesen Dienst)
alexa.sidecar.base-url=${ALEXA_SIDECAR_URL:http://localhost:3456}

# Alexa Air Quality Monitor polling
alexa.air-quality.polling.interval-ms=300000
alexa.air-quality.polling.initial-delay-ms=20000

# Nuki Smart Lock (Web API, Cloud-Polling)
nuki.enabled=${NUKI_ENABLED:true}
nuki.api-token=${NUKI_API_TOKEN:}
nuki.base-url=https://api.nuki.io
nuki.poll-interval-ms=30000
nuki.initial-delay-ms=15000
nuki.http-timeout-ms=5000

# Rebooter-Sidecar (Reboot-Button im Dashboard; ohne URL+Token deaktiviert)
rebooter.base-url=${REBOOTER_URL:}
rebooter.token=${REBOOTER_TOKEN:}

# Blink-Gesichtserkennung (blink-vision-Sidecar)
vision.enabled=true
vision.sidecar-base-url=${VISION_SIDECAR_URL:http://localhost:8090}
vision.heartbeat-timeout-seconds=180

# Tractive-Haustiertracker (inoffizielle Cloud-API; Login erfolgt in der App)
tractive.enabled=${TRACTIVE_ENABLED:true}
tractive.base-url=https://graph.tractive.com/4
tractive.poll-interval-ms=30000
tractive.initial-delay-ms=20000
tractive.http-timeout-ms=10000

# Lüftungsempfehlung (Intelligence Hub + binary_sensor.insight_ventilation)
ventilation.room-threshold-celsius=24
ventilation.min-difference-celsius=2
ventilation.off-difference-celsius=1
ventilation.stale-after-minutes=30
ventilation.report-interval-ms=300000
ventilation.initial-delay-ms=60000

# Multipart-Uploads (Referenzfotos fuer die Gesichtserkennung sind Handy-Fotos, oft > 1 MB Default)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Telegram-KI-Assistent
telegram.enabled=${TELEGRAM_ENABLED:true}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.allowed-chat-ids=${TELEGRAM_ALLOWED_CHAT_IDS:}
telegram.anthropic-api-key=${ANTHROPIC_API_KEY:}
telegram.model=${TELEGRAM_AGENT_MODEL:claude-haiku-4-5-20251001}

# Benutzerverwaltung
# Der erste Start legt admin/changeit an; der Wechsel wird beim ersten Login erzwungen.
# Fester Schluessel, damit Remember-Me-Cookies Backend-Neustarts ueberleben
auth.remember-me-key=${REMEMBER_ME_KEY:}
server.servlet.session.timeout=12h
