# Household Manager - Main Configuration

# Application Name
spring.application.name=household-manager

# DataSource Configuration for MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/household_manager?createDatabaseIfNotExist=true
spring.datasource.username=household_manager
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.drop-first=false

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.error.include-message=always
server.error.include-binding-errors=always

# Actuator Configuration for Health Checks
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/management
management.endpoint.health.show-details=when-authorized

# Logging Configuration
logging.level.com.household=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# CORS (comma-separated)
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200

# Tasmota Electricity Polling
tasmota.electricity.url=http://192.168.1.134/cm?cmnd=Status%2010
tasmota.electricity.live.interval-ms=1000

# Airrohr Fine Dust Sensor
airrohr.url=http://192.168.1.110/data.json
airrohr.polling.interval-ms=300000
airrohr.polling.initial-delay-ms=15000

# Tapo Configuration
tapo.email=${TAPO_EMAIL:}
tapo.password=${TAPO_PASSWORD:}
tapo.cloud-api-url=https://wap.tplinkcloud.com
tapo.cloud-token-expiry-ms=86400000

# Statische Tapo-IPs nur fuer Umgebungen ohne UDP-Broadcast (z.B. Docker-Bridge) pflegen.
# Veraltete Eintraege verlangsamen jede Discovery um mehrere Verbindungs-Timeouts.
# tapo.devices[0].name=...
# tapo.devices[0].ip=...
# tapo.devices[0].device-id=...


# Meross Cloud Configuration
meross.email=${MEROSS_EMAIL:}
meross.password=${MEROSS_PASSWORD:}
meross.country-code=de
meross.region=eu

# Meross Electricity Polling (spiegelt Verbrauch als sensor.meross_<uuid>_power)
meross.electricity.polling.enabled=true
meross.electricity.polling.interval-ms=60000
# Waschmaschine
meross.electricity.polling.device-ids=2112156531504590863548e1e9817420

# Shelly Balcony Power Plants
shelly.devices[0].name=Balkonkraftwerk-Alt
shelly.devices[0].ip=${SHELLY_1_IP:192.168.1.130}
shelly.devices[1].name=Balkonkraftwerk-Neu
shelly.devices[1].ip=${SHELLY_2_IP:192.168.1.131}
shelly.polling.interval-ms=5000
shelly.http.timeout-ms=3000

# AnkerSolix Solar System
ankersolix.enabled=${ANKER_ENABLED:false}
ankersolix.user=${ANKER_USER:}
ankersolix.password=${ANKER_PASSWORD:}
ankersolix.country=${ANKER_COUNTRY:DE}
ankersolix.live.interval-ms=10000

# DWD Wetter (WarnWetter-App-API)
dwd.base-url=https://app-prod-ws.warnwetter.de/v30/stationOverviewExtended
dwd.station-id=10637
dwd.cache-ttl-ms=600000
dwd.polling.interval-ms=900000
dwd.polling.initial-delay-ms=20000

# UBA Luftqualitaetsindex (Umweltbundesamt)
uba.base-url=https://luftdaten.umweltbundesamt.de/api/air-data/v3/airquality/json
uba.station-id=636
uba.cache-ttl-ms=600000

# Zigbee MQTT (zigbee2mqtt via Mosquitto)
zigbee.mqtt.enabled=${ZIGBEE_MQTT_ENABLED:true}
zigbee.mqtt.host=${ZIGBEE_MQTT_HOST:192.168.1.150}
zigbee.mqtt.port=${ZIGBEE_MQTT_PORT:1883}
zigbee.mqtt.username=${ZIGBEE_MQTT_USER:addons}
zigbee.mqtt.password=${ZIGBEE_MQTT_PASSWORD:}
zigbee.mqtt.topic-filter=zigbee2mqtt/#
zigbee.mqtt.client-id=household-manager-zigbee

# Alexa Text-to-Speech Integration
alexa.domain=${ALEXA_DOMAIN:amazon.de}
# Faelligkeitspruefung fuer geplante Ansagen (ms)
alexa.scheduled.check-interval-ms=60000
# alexa-remote2-Sidecar (Login, Geraeteliste und TTS laufen ueber diesen Dienst)
alexa.sidecar.base-url=${ALEXA_SIDECAR_URL:http://localhost:3456}

# Alexa Air Quality Monitor polling
alexa.air-quality.polling.interval-ms=300000
alexa.air-quality.polling.initial-delay-ms=20000
