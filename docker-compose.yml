services:
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: household_manager
      DB_USERNAME: household_manager
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://192.168.1.100:4200

      # Benutzerverwaltung & API-Sicherheit
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:-}

      # AnkerSolix
      ANKER_ENABLED: ${ANKER_ENABLED:-false}
      ANKER_USER: ${ANKER_USER:-}
      ANKER_PASSWORD: ${ANKER_PASSWORD:-}
      ANKER_COUNTRY: ${ANKER_COUNTRY:-DE}

      # Tapo
      TAPO_EMAIL: ${TAPO_EMAIL:-}
      TAPO_PASSWORD: ${TAPO_PASSWORD:-}

      # Meross
      MEROSS_EMAIL: ${MEROSS_EMAIL:-}
      MEROSS_PASSWORD: ${MEROSS_PASSWORD:-}

      # Shelly
      SHELLY_1_IP: ${SHELLY_1_IP:-192.168.1.130}
      SHELLY_2_IP: ${SHELLY_2_IP:-192.168.1.131}

      # Zigbee MQTT: Quelle ist der Mosquitto des HA-Zigbee2MQTT-Add-ons,
      # NICHT der lokale mosquitto-Container (der ist fuer das kuenftige
      # "HA abloesen"-Szenario reserviert).
      ZIGBEE_MQTT_HOST: ${ZIGBEE_MQTT_HOST:-192.168.1.150}
      ZIGBEE_MQTT_PORT: ${ZIGBEE_MQTT_PORT:-1883}
      ZIGBEE_MQTT_USER: ${ZIGBEE_MQTT_USER:-addons}
      ZIGBEE_MQTT_PASSWORD: ${ZIGBEE_MQTT_PASSWORD:-}

      # Alexa (alexa-remote2 Sidecar)
      ALEXA_SIDECAR_URL: http://alexa-sidecar:3456

      # Nuki
      NUKI_API_TOKEN: ${NUKI_API_TOKEN:-}

      # Telegram-KI-Assistent
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Blink-Gesichtserkennung (blink-vision-Sidecar)
      VISION_SIDECAR_URL: http://blink-vision:8090
    depends_on:
      - mosquitto
      - alexa-sidecar
    ports:
      - "8080:8080"
    networks:
      - mariadb_default
      - app_net

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - app_net

  alexa-sidecar:
    build:
      context: ./alexa-sidecar
    restart: unless-stopped
    environment:
      PORT: "3456"
      PROXY_PORT: "3457"
      # Adresse, unter der der BROWSER den Login-Proxy erreicht (Host-IP, NICHT der Container).
      # Muss vom Browser des Nutzers aus auf Port 3457 erreichbar sein.
      PROXY_HOST: ${ALEXA_PROXY_HOST:-192.168.1.100}
      AMAZON_PAGE: ${ALEXA_DOMAIN:-amazon.de}
      COOKIE_PATH: /data/alexa-cookie.json
    volumes:
      - alexa_sidecar_data:/data
    ports:
      - "3456:3456"
      - "3457:3457"
    networks:
      - app_net

  blink-vision:
    build:
      context: ./blink-vision
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      API_TOKEN: ${VISION_API_TOKEN:-}
      BLINK_CAMERA_NAME: ${BLINK_CAMERA_NAME:-}
      CONFIDENCE_THRESHOLD: ${VISION_CONFIDENCE_THRESHOLD:-0.5}
      POLL_SECONDS: "10"
    volumes:
      - blink_vision_data:/data
    # Bewusst KEIN Port-Mapping: der Sidecar hat keine Authentifizierung und
    # nimmt unter /auth/login die Amazon-Zugangsdaten entgegen. Das Backend
    # erreicht ihn ueber app_net; zum Debuggen bei Bedarf temporaer
    # "127.0.0.1:8090:8090" ergaenzen (nur lokal, nicht im LAN).
    networks:
      - app_net

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "1883:1883"
    networks:
      - app_net

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    restart: unless-stopped
    volumes:
      - ./zigbee2mqtt/data:/app/data
    ports:
      - "8081:8081"
    environment:
      TZ: Europe/Berlin
    depends_on:
      - mosquitto
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

  mariadb_default:
    external: true

volumes:
  mosquitto_data:
  mosquitto_log:
  zigbee2mqtt_data:
  alexa_sidecar_data:
  blink_vision_data:
