services:
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: household_manager
      DB_USERNAME: household_manager
      DB_PASSWORD: household_manager
      CORS_ALLOWED_ORIGINS: http://192.168.1.100:4200
    ports:
      - "8080:8080"
    networks:
      - mariadb_default
      - app_net

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

  mariadb_default:
    external: true
