services:
  backend:
    build:
      context: ./backend
    environment:
      # Ohne TZ laeuft der Container in UTC, und jedes nackte LocalDateTime.now()
      # schreibt Zeitstempel zwei Stunden hinter der Wanduhr — waehrend ClockConfig
      # (Kalender, Muellerinnerung, Wetter-Import) ausdruecklich Europe/Berlin nutzt.
      # Diese Vermischung liess u. a. die Aussentemperatur aus dem Chart fallen und
      # Flow-Zeitplaene zwei Stunden zu spaet feuern.
      TZ: Europe/Berlin
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: household_manager
      DB_USERNAME: household_manager
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://192.168.1.100:4200,https://192.168.1.100:4443}

      # Benutzerverwaltung & API-Sicherheit
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:-}

      # AnkerSolix
      ANKER_ENABLED: ${ANKER_ENABLED:-false}
      ANKER_USER: ${ANKER_USER:-}
      ANKER_PASSWORD: ${ANKER_PASSWORD:-}
      ANKER_COUNTRY: ${ANKER_COUNTRY:-DE}

      # Tapo
      TAPO_EMAIL: ${TAPO_EMAIL:-}
      TAPO_PASSWORD: ${TAPO_PASSWORD:-}

      # Meross
      MEROSS_EMAIL: ${MEROSS_EMAIL:-}
      MEROSS_PASSWORD: ${MEROSS_PASSWORD:-}

      # Shelly
      SHELLY_1_IP: ${SHELLY_1_IP:-192.168.1.130}
      SHELLY_2_IP: ${SHELLY_2_IP:-192.168.1.131}

      # Zigbee MQTT: eigener mosquitto-Container, gespeist vom eigenen
      # zigbee2mqtt-Container (seit der HA-Abschaltung 2026-10-30). Derselbe
      # Nutzer/dasselbe Passwort gelten fuer Broker, zigbee2mqtt und Backend.
      ZIGBEE_MQTT_HOST: ${ZIGBEE_MQTT_HOST:-mosquitto}
      ZIGBEE_MQTT_PORT: ${ZIGBEE_MQTT_PORT:-1883}
      ZIGBEE_MQTT_USER: ${ZIGBEE_MQTT_USER:-household}
      ZIGBEE_MQTT_PASSWORD: ${ZIGBEE_MQTT_PASSWORD:?ZIGBEE_MQTT_PASSWORD fehlt in .env}

      # Alexa (alexa-remote2 Sidecar)
      ALEXA_SIDECAR_URL: http://alexa-sidecar:3456

      # Nuki
      NUKI_API_TOKEN: ${NUKI_API_TOKEN:-}

      # Telegram-KI-Assistent
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-4-5}
      AGENT_QUIET_HOURS: ${AGENT_QUIET_HOURS:-22:00-07:00}
      AGENT_DAILY_TOKEN_BUDGET: ${AGENT_DAILY_TOKEN_BUDGET:-300000}
      CHARGING_ENBW_API_KEY: ${CHARGING_ENBW_API_KEY:-}

      # Blink-Gesichtserkennung (blink-vision-Sidecar)
      VISION_SIDECAR_URL: http://blink-vision:8090

      # Reboot-Button (rebooter-Sidecar)
      REBOOTER_URL: http://rebooter:8095
      REBOOTER_TOKEN: ${REBOOTER_TOKEN:-}
    depends_on:
      - mosquitto
      - alexa-sidecar
    ports:
      - "8080:8080"
    networks:
      - mariadb_default
      - app_net

  frontend:
    build:
      context: ./frontend
    environment:
      # SANs des beim ersten Start erzeugten TLS-Zertifikats. Nach einer
      # Aenderung certs/server.crt + certs/server.key loeschen, damit neu
      # ausgestellt wird (die CA und damit die Geraete-Installation bleiben).
      TLS_SANS: ${TLS_SANS:-IP:192.168.1.100,DNS:localhost}
    ports:
      - "4200:80"
      - "4443:443"
    volumes:
      # CA + Server-Zertifikat; certs/ca.crt einmalig auf jedem Geraet
      # installieren, sonst verweigern die Browser den Service Worker
      - ./certs:/etc/nginx/certs
    depends_on:
      - backend
    networks:
      - app_net

  alexa-sidecar:
    build:
      context: ./alexa-sidecar
    restart: unless-stopped
    environment:
      PORT: "3456"
      PROXY_PORT: "3457"
      # Adresse, unter der der BROWSER den Login-Proxy erreicht (Host-IP, NICHT der Container).
      # Muss vom Browser des Nutzers aus auf Port 3457 erreichbar sein.
      PROXY_HOST: ${ALEXA_PROXY_HOST:-192.168.1.100}
      AMAZON_PAGE: ${ALEXA_DOMAIN:-amazon.de}
      COOKIE_PATH: /data/alexa-cookie.json
    volumes:
      - alexa_sidecar_data:/data
    ports:
      - "3456:3456"
      - "3457:3457"
    networks:
      - app_net

  blink-vision:
    build:
      context: ./blink-vision
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      API_TOKEN: ${VISION_API_TOKEN:-}
      BLINK_CAMERA_NAME: ${BLINK_CAMERA_NAME:-}
      CONFIDENCE_THRESHOLD: ${VISION_CONFIDENCE_THRESHOLD:-0.5}
      POLL_SECONDS: "10"
    volumes:
      - blink_vision_data:/data
    # Bewusst KEIN Port-Mapping: der Sidecar hat keine Authentifizierung und
    # nimmt unter /auth/login die Amazon-Zugangsdaten entgegen. Das Backend
    # erreicht ihn ueber app_net; zum Debuggen bei Bedarf temporaer
    # "127.0.0.1:8090:8090" ergaenzen (nur lokal, nicht im LAN).
    networks:
      - app_net

  rebooter:
    build:
      context: ./rebooter
    restart: unless-stopped
    environment:
      REBOOTER_TOKEN: ${REBOOTER_TOKEN:-}
    volumes:
      # Docker-Socket = root-aequivalenter Host-Zugriff; deshalb lebt er in
      # diesem winzigen, zustandslosen Sidecar statt im LAN-exponierten Backend.
      - /var/run/docker.sock:/var/run/docker.sock
    # Bewusst KEIN Port-Mapping (Muster blink-vision): der Sidecar kennt nur
    # den Shared-Token als Schutz und ist deshalb nur ueber app_net erreichbar.
    networks:
      - app_net

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      MQTT_USER: ${ZIGBEE_MQTT_USER:-household}
      MQTT_PASSWORD: ${ZIGBEE_MQTT_PASSWORD:?ZIGBEE_MQTT_PASSWORD fehlt in .env}
    # Konfiguration und Passwort-File entstehen bei jedem Start im Container
    # (kein Hash im Repo). Bewusst KEIN Bind-Mount: Portainer klont das Repo in
    # sein eigenes Volume, relative Bind-Mounts zeigen dann auf ein leeres
    # Host-Verzeichnis (/data/compose/<id>/...) — Mosquitto fand so keine Config.
    # Mosquitto 2 verlangt, dass das Passwort-File dem mosquitto-Nutzer gehoert.
    command: >-
      sh -c 'printf "%s\n" "listener 1883" "allow_anonymous false"
      "password_file /mosquitto/data/passwd" "persistence true"
      "persistence_location /mosquitto/data/" "log_dest stdout"
      > /mosquitto/data/mosquitto.conf
      && mosquitto_passwd -c -b /mosquitto/data/passwd "$$MQTT_USER" "$$MQTT_PASSWORD"
      && chown mosquitto:mosquitto /mosquitto/data/passwd
      && chmod 0700 /mosquitto/data/passwd
      && exec mosquitto -c /mosquitto/data/mosquitto.conf'
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    # Bewusst KEIN Host-Port-Mapping: "1883:1883" liess den Stack-Deploy am
    # 2026-10-30 scheitern (Container blieb in "Starting", Portainer entfernte
    # daraufhin den ganzen Stack) — wie schon frueher eine stale Docker-Port-
    # Allokation. Das Backend erreicht den Broker ueber app_net; ein Dev-Backend
    # kann damit nicht mehr mitlesen.
    networks:
      - app_net

  zigbee2mqtt:
    # Gepinnt auf die Version des abgeloesten HA-Add-ons; database.db und
    # configuration.yaml stammen aus dieser Version.
    image: koenkk/zigbee2mqtt:2.14.2
    restart: unless-stopped
    volumes:
      # Enthaelt Netzwerkschluessel, database.db und coordinator_backup.json
      # (gitignored) — der Ordner IST das Zigbee-Netz, vor Experimenten sichern.
      # Unter Portainer (Git-Stack 13) liegt er auf dem HOST unter
      # /data/compose/13/zigbee2mqtt/data, nicht im Repo-Klon von Portainer.
      - ./zigbee2mqtt/data:/app/data
    ports:
      - "8081:8081"
    environment:
      TZ: Europe/Berlin
      ZIGBEE2MQTT_CONFIG_MQTT_USER: ${ZIGBEE_MQTT_USER:-household}
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: ${ZIGBEE_MQTT_PASSWORD:?ZIGBEE_MQTT_PASSWORD fehlt in .env}
      ZIGBEE2MQTT_CONFIG_FRONTEND_AUTH_TOKEN: ${ZIGBEE2MQTT_FRONTEND_TOKEN:?ZIGBEE2MQTT_FRONTEND_TOKEN fehlt in .env}
    depends_on:
      - mosquitto
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

  mariadb_default:
    external: true

volumes:
  mosquitto_data:
  mosquitto_log:
  zigbee2mqtt_data:
  alexa_sidecar_data:
  blink_vision_data:
