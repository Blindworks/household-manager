services:
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: household_manager
      DB_USERNAME: household_manager
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://192.168.1.100:4200

      # AnkerSolix
      ANKER_ENABLED: ${ANKER_ENABLED:-false}
      ANKER_USER: ${ANKER_USER:-}
      ANKER_PASSWORD: ${ANKER_PASSWORD:-}
      ANKER_COUNTRY: ${ANKER_COUNTRY:-DE}

      # Tapo
      TAPO_EMAIL: ${TAPO_EMAIL:-}
      TAPO_PASSWORD: ${TAPO_PASSWORD:-}

      # Meross
      MEROSS_EMAIL: ${MEROSS_EMAIL:-}
      MEROSS_PASSWORD: ${MEROSS_PASSWORD:-}

      # Shelly
      SHELLY_1_IP: ${SHELLY_1_IP:-192.168.1.130}
      SHELLY_2_IP: ${SHELLY_2_IP:-192.168.1.131}
    ports:
      - "8080:8080"
    networks:
      - mariadb_default
      - app_net

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - app_net

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    ports:
      - "1883:1883"
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

  mariadb_default:
    external: true

volumes:
  mosquitto_data:
  mosquitto_log:
  zigbee2mqtt_data:
