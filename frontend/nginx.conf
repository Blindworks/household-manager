server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Service-Worker-Dateien duerfen NIE aus einem HTTP-Cache kommen: haengt ein
  # Client auf einem alten ngsw.json/ngsw-worker.js fest, bleibt er dauerhaft
  # auf einer alten App-Version, obwohl laengst neu deployt wurde.
  location ~ ^/(ngsw\.json|ngsw-worker\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    # Der Upstream MUSS ueber eine Variable laufen: bei einem literalen
    # "proxy_pass http://backend:8080" loest nginx den Namen genau einmal beim
    # Start auf und haelt die Container-IP fuer immer fest. Wird danach nur der
    # Backend-Container neu gebaut, bekommt er eine neue IP im app_net — nginx
    # verbindet weiter zur alten, und JEDER /api/-Request endet in 502, waehrend
    # die Oberflaeche normal laedt und das Backend auf 8080 gesund ist.
    # Mit Variable + resolver fragt nginx den Docker-DNS zur Laufzeit erneut.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://backend:8080;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
