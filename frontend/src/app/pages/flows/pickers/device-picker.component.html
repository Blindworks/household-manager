<div class="picker">
  <select [ngModel]="value() ?? ''" (ngModelChange)="select($event)">
    <option value="" disabled>Gerät wählen…</option>
    @for (opt of options(); track opt.id) {
      <option [value]="opt.id">{{ opt.deviceName }}</option>
    }
  </select>
  @if (displayLabel().startsWith('nicht gefunden')) {
    <span class="picker__missing">{{ displayLabel() }}</span>
  }
</div>
