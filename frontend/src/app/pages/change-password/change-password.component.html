<div class="change-password">
  <form class="change-password__card" (ngSubmit)="submit()">
    <h1 class="change-password__title">Passwort ändern</h1>
    @if (forced) {
      <p class="change-password__subtitle">
        Bitte lege jetzt ein eigenes Passwort fest, bevor es weitergeht.
      </p>
    } @else {
      <p class="change-password__subtitle">Neues Passwort festlegen</p>
    }

    @if (errorMessage) {
      <div class="change-password__error" role="alert">{{ errorMessage }}</div>
    }

    <label class="change-password__label" for="currentPassword">Aktuelles Passwort</label>
    <input class="change-password__input" id="currentPassword" name="currentPassword" type="password"
           [(ngModel)]="currentPassword" autocomplete="current-password" autofocus>

    <label class="change-password__label" for="newPassword">Neues Passwort (min. 8 Zeichen)</label>
    <input class="change-password__input" id="newPassword" name="newPassword" type="password"
           [(ngModel)]="newPassword" autocomplete="new-password">

    <label class="change-password__label" for="repeatPassword">Neues Passwort wiederholen</label>
    <input class="change-password__input" id="repeatPassword" name="repeatPassword" type="password"
           [(ngModel)]="repeatPassword" autocomplete="new-password">

    @if (repeatPassword && newPassword !== repeatPassword) {
      <p class="change-password__hint">Die Passwörter stimmen nicht überein.</p>
    }

    <button class="change-password__submit" type="submit" [disabled]="isLoading || !valid">
      {{ isLoading ? 'Speichern …' : 'Passwort ändern' }}
    </button>
  </form>
</div>
