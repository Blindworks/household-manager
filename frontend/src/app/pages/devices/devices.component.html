<div class="devices">
  <p class="message message--error" *ngIf="errorMessage">
    {{ errorMessage }}
    <button class="message__close" (click)="dismissError()">&times;</button>
  </p>

  <div *ngIf="isLoading" class="devices__loading">
    <p>Lade Geraete...</p>
  </div>

  <ng-container *ngIf="!isLoading">
    <div *ngIf="devices.length === 0" class="devices__empty">
      <p>Noch keine Geraete vorhanden.</p>
      <p class="devices__empty-note">Bitte im Admin-Bereich nach Geraeten suchen und konfigurieren.</p>
    </div>

    <section class="devices__group" *ngFor="let group of groupedDevices">
      <div class="devices__group-header">
        <h2>{{ group.label }}</h2>
      </div>

      <div class="devices__grid">
        <article class="device-card" *ngFor="let device of group.devices; trackBy: trackByDeviceId">
          <h3 class="device-card__name">{{ device.deviceName }}</h3>
          <p class="device-card__status" [ngClass]="getStatusClass(device)">
            {{ getStatusText(device) }}
          </p>
        </article>
      </div>
    </section>
  </ng-container>
</div>
