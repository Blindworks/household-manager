<header class="header">
  <div class="container">
    <div class="header__wrapper">
      <div class="header__brand">
        <a routerLink="/" class="header__logo">
          <img
            src="/assets/Household_manager_logo.png"
            alt="Household Manager Logo"
            class="header__logo-image"
          />
          <span class="header__title">Household Manager</span>
        </a>
      </div>

      <button
        class="header__mobile-toggle"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="isMobileMenuOpen()"
        aria-label="Toggle navigation menu">
        @if (!isMobileMenuOpen()) {
          <app-icon name="menu" class="header__icon"></app-icon>
        } @else {
          <app-icon name="x" class="header__icon"></app-icon>
        }
      </button>
    </div>

    @if (isMobileMenuOpen()) {
      <nav class="header__nav header__nav--mobile">
        <ul class="header__nav-list">
          @for (link of navLinks; track link.path) {
            <li class="header__nav-item">
              <a [routerLink]="link.path"
                 routerLinkActive="header__nav-link--active"
                 [routerLinkActiveOptions]="{ exact: !!link.exact }"
                 (click)="closeMobileMenu()"
                 class="header__nav-link">
                {{ link.label }}
              </a>
            </li>
          }
        </ul>
      </nav>
    }
  </div>
</header>

<aside class="header-sidebar">
  <nav class="header-sidebar__nav" aria-label="Hauptnavigation">
    <ul class="header-sidebar__list">
      @for (link of navLinks; track link.path) {
        <li class="header-sidebar__item">
          <a [routerLink]="link.path"
             routerLinkActive="header-sidebar__link--active"
             [routerLinkActiveOptions]="{ exact: !!link.exact }"
             class="header-sidebar__link">
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</aside>
